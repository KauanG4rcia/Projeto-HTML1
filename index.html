<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Sites Favoritos</title>
    <link rel="icon" href="imagens/LogoSVG.svg" type="image/svg+xml">
</head>
<body>
    <style>
        /*Para a estilizção do Site, Fonte, Cor de Fundo, Centralização e Animação*/ 
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            letter-spacing: -0.5px;
        }
        img {
            width: 100px;
            height: 100px;
        }
        img:hover {
            transform: translateY(-10px); /*Faz o efeito de subida quando passam o mouse*/
        }
        .cubo1, .cubo2, .cubo3, .cubo4, .cubo5 {
            display: inline-block;
            margin: 20px;
            padding: 10px; 
        }
        </style>
    <!---Deixa o Site centralizado-->
    <div style="text-align: center;">
    <!---Titulo da Pagina-->
        <h1>Meus Sites Favoritos: Kauan Garcia</h1>

    <!--Sites com classes para Maior modificação-->    
    <div class ="cubo1">
    <h1>YouTube</h1>
    <a href="https://www.youtube.com">
        <img src="imagens/youtube.png" alt="YouTube">
    </a> <br>
    </div>

    <div class ="cubo2">
    <h1>Chess.com</h1>
    <a href="https://www.chess.com">
        <img src="imagens/chess.png" alt="Chess.com">
    </a> <br>
   </div>

   <div class ="cubo3">
   <h1>Canva</h1>
    <a href="https://www.canva.com">
        <img src="imagens/canva.png" alt="Canva">
    </a>
   </div>

   <div class ="cubo4">
     <h1>Github</h1>
    <a href="https://www.github.com">
        <img src="imagens/github.png" alt="Github">
    </a> <br>
   </div>

   <div class ="cubo5">
    <h1>w3schools</h1>
    <a href="https://www.w3schools.com">
        <img src="imagens/w3.png" alt="w3schools">
    </a>
   </div>
</body>
</html>
